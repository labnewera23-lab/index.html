<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice GK Robot Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0b20;
            color: white;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        h1 { margin-top: 0; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

        #question-container {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #7928ca;
            padding: 30px;
            margin: 25px auto;
            width: 70%;
            max-width: 600px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        #question { font-size: 24px; min-height: 60px; margin-bottom: 20px; }
        #status { color: #ff0080; font-weight: bold; height: 20px; text-transform: uppercase; letter-spacing: 1px; }
        #score { color: #ffdd00; font-size: 24px; margin-bottom: 10px; font-weight: bold; }

        button {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff0080, #7928ca);
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 128, 0.4);
        }
        button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 0, 128, 0.6); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>🤖 Voice GK Robot Pro</h1>
    <div id="score">Score: 0</div>
    
    <div id="question-container">
        <div id="question">Ready to test your knowledge?</div>
        <div id="status">Click the button to begin</div>
    </div>

    <button onclick="startQuiz()" id="mainBtn">🎤 Start Quiz</button>

<script>
    let recognition;
    let currentAnswer = "";
    let waitingForNext = false;
    let score = 0;

    const questions = [
        {q:"How many continents are there?", a:"seven"},
        {q:"What is the capital of India?", a:"new delhi"},
        {q:"Which is the largest planet?", a:"jupiter"},
        {q:"Who is the father of the nation?", a:"gandhi"},
        {q:"In which year did India get independence?", a:"1947"},
        {q:"Which gas do plants take in?", a:"carbon dioxide"},
        {q:"Which country invented zero?", a:"india"}
    ];

    const aiQuestions = [
        {q:"What is the full form of AI?", a:"artificial intelligence"},
        {q:"Which device is called the brain of computer?", a:"cpu"},
        {q:"Which language is used to create web pages?", a:"html"},
        {q:"What does GPS stand for?", a:"global positioning system"}
    ];

    // Initialize Speech Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const result = event.results[0][0].transcript.toLowerCase();
            document.getElementById("status").innerText = "You said: " + result;
            
            if(waitingForNext) {
                handleNextChoice(result);
            } else {
                checkAnswer(result);
            }
        };

        recognition.onerror = (e) => {
            console.error("Recognition Error:", e.error);
            if(e.error === 'not-allowed') {
                alert("Please allow microphone access to play!");
            }
        };
    } else {
        alert("Your browser does not support Speech Recognition. Please use Chrome.");
    }

    function speak(text, callback) {
        window.speechSynthesis.cancel(); // Stop any current speech
        let speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-IN";
        speech.rate = 1.0;
        speech.onend = () => { if(callback) callback(); };
        window.speechSynthesis.speak(speech);
    }

    function safeStartRecognition() {
        try {
            recognition.start();
            document.getElementById("status").innerText = "Listening...";
        } catch(e) {
            console.log("Recognition already running");
        }
    }

    function startQuiz() {
        document.getElementById("mainBtn").style.display = "none";
        askQuestion();
    }

    function askQuestion() {
        waitingForNext = false;
        let pool = Math.random() < 0.3 ? aiQuestions : questions;
        let qObj = pool[Math.floor(Math.random() * pool.length)];

        currentAnswer = qObj.a;
        document.getElementById("question").innerText = qObj.q;
        
        speak(qObj.q, safeStartRecognition);
    }

    function checkAnswer(ans) {
        if(ans.includes(currentAnswer)) {
            score++;
            document.getElementById("score").innerText = "Score: " + score;
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            speak("Correct! Your score is " + score);
        } else {
            speak("Wrong. The correct answer is " + currentAnswer);
        }

        setTimeout(() => {
            waitingForNext = true;
            speak("Do you want another question? Say yes or no", safeStartRecognition);
        }, 2000);
    }

    function handleNextChoice(text) {
        if(text.includes("yes")) {
            askQuestion();
        } else if(text.includes("no")) {
            speak("Okay. Quiz finished. Your final score is " + score);
            document.getElementById("question").innerText = "Game Over";
            document.getElementById("status").innerText = "Final Score: " + score;
            document.getElementById("mainBtn").style.display = "inline-block";
            document.getElementById("mainBtn").innerText = "Play Again";
        } else {
            speak("I didn't catch that. Please say yes or no", safeStartRecognition);
        }
    }
</script>
</body>
</html>
